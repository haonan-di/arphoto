name: arphoto
description: AR Photo Print App — 扫描打印照片，复现 Live 动图 + Emoji 悬浮
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5
  image: ^4.0.17
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  video_player: ^2.8.1
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
